name = "hopebed-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
CORS_ORIGIN = "https://hopabedin.mithagaris.workers.dev,http://localhost:3000"
API_URL = "https://hopebed-api.mithagaris.workers.dev"
FRONTEND_URL = "https://hopabedin.mithagaris.workers.dev"
R2_REGION = "auto"
PAYU_ENV = "production"
MONGODB_DB_NAME = "hopebed"
CF_WORKER = "true"
JWT_SECRET = "dummy_secret_that_is_at_least_32_chars_long"
GOOGLE_CLIENT_ID = "dummy_client_id"
MONGODB_URI = "mongodb+srv://dummy:dummy@cluster.mongodb.net/test"
PAYU_MERCHANT_KEY = "dummy_key"
PAYU_MERCHANT_SALT = "dummy_salt"

